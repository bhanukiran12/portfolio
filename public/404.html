<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#ffffff" />
    <title>Page not found | BB Technologies</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #14140f; background: #fff; font: 400 16px/1.65 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 760px); }
      .brand { display: inline-block; margin-bottom: 72px; color: #14140f; text-decoration: none; font-weight: 700; letter-spacing: -.04em; font-size: 1.15rem; }
      .code { color: #2f5dff; font: 500 .78rem/1.4 Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 14px 0 10px; font-size: clamp(2.8rem, 8vw, 5.5rem); line-height: 1.04; letter-spacing: -.06em; }
      p { margin: 0; color: #55554e; font-size: 1.05rem; }
      a.home { display: inline-flex; margin-top: 32px; padding: 13px 22px; border-radius: 999px; background: #14140f; color: #fff; text-decoration: none; font-weight: 600; }
      a.home:focus-visible { outline: 3px solid #2f5dff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">BhanuBeyond Technologies</a>
      <p class="code">404 — Page not found</p>
      <h1>That page isn’t here.</h1>
      <p>The link may be outdated, or the page may have moved.</p>
      <a class="home" href="/">Back to BhanuBeyond</a>
    </main>
  </body>
</html>
